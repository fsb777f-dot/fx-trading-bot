<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FX Trading Bot</title>
<!-- Подключаем библиотеку графиков TradingView -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #131722; /* Цвет как в TradingView */
        color: #d1d4dc; padding-bottom: 60px; /* Отступ под нижнее меню */
    }
    
    /* --- График --- */
    #chart-container { width: 100%; height: 320px; background: #131722; }
    
    /* --- Информация о выбранной паре --- */
    .pair-header { padding: 16px; border-bottom: 1px solid #2a2e39; }
    .pair-title-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .pair-title { font-size: 22px; font-weight: 700; color: #fff; }
    .pair-change { font-size: 14px; font-weight: 600; color: #089981; } /* Зеленый для роста */
    
    .levels-row { display: flex; gap: 8px; }
    .level-box { flex: 1; background: #1e222d; border-radius: 6px; padding: 8px; }
    .level-label { font-size: 11px; color: #787b86; margin-bottom: 4px; }
    .level-value { font-size: 14px; font-weight: 600; }
    .level-value.sl { color: #f23645; } /* Красный */
    .level-value.tp { color: #089981; } /* Зеленый */
    
    .disclaimer { font-size: 11px; color: #787b86; margin-top: 12px; line-height: 1.4; }
    
    /* --- Список пар --- */
    .pair-list { background: #131722; }
    .list-item { 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 14px 16px; border-bottom: 1px solid #2a2e39; cursor: pointer;
    }
    .list-item.active { background: #1e222d; }
    .list-item-left { display: flex; flex-direction: column; }
    .list-symbol { font-size: 16px; font-weight: 600; color: #fff; }
    .list-signal { font-size: 11px; color: #787b86; margin-top: 2px; }
    .list-item-right { text-align: right; display: flex; flex-direction: column; }
    .list-price { font-size: 16px; font-weight: 500; }
    .list-price-change { font-size: 12px; }
    .up { color: #089981; } .down { color: #f23645; } .neutral { color: #787b86; }
    
    /* --- Нижнее меню --- */
    .bottom-nav {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
        background: #1e222d; display: flex; justify-content: space-around;
        align-items: center; border-top: 1px solid #2a2e39;
    }
    .nav-item { color: #787b86; font-size: 11px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
    .nav-item.active { color: #2962ff; }
    .nav-icon { font-size: 20px; }
</style>
</head>
<body>

    <!-- Контейнер для свечного графика -->
    <div id="chart-container"></div>

    <!-- Блок с информацией о паре -->
    <div class="pair-header">
        <div class="pair-title-row">
            <div class="pair-title" id="header-symbol">EUR/USD</div>
            <div class="pair-change" id="header-change">+0.31%</div>
        </div>
        <div class="levels-row">
            <div class="level-box">
                <div class="level-label">Вход</div>
                <div class="level-value" id="header-entry">1.08642</div>
            </div>
            <div class="level-box">
                <div class="level-label">Стоп-лосс</div>
                <div class="level-value sl" id="header-sl">1.08460</div>
            </div>
            <div class="level-box">
                <div class="level-label">Тейк-профит</div>
                <div class="level-value tp" id="header-tp">1.09007</div>
            </div>
        </div>
        <div class="disclaimer">Уровни пока считаются заглушкой. Настоящие точки входа появятся после подключения стратегий.</div>
    </div>

    <!-- Список пар -->
    <div class="pair-list" id="pair-list">
        <!-- Заполняется через JS -->
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-item active"><div class="nav-icon">📈</div>Рынок</div>
        <div class="nav-item"><div class="nav-icon">⚙️</div>Стратегии</div>
        <div class="nav-item"><div class="nav-icon">🧪</div>Тест</div>
        <div class="nav-item"><div class="nav-icon">💼</div>Счёт</div>
    </div>

<script>
// Инициализация графика
const chartContainer = document.getElementById('chart-container');
const chart = LightweightCharts.createChart(chartContainer, {
    layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#2a2e39' },
    timeScale: { borderColor: '#2a2e39', timeVisible: true },
    handleScroll: false, handleScale: false, // Отключаем скролл, чтобы страница не дергалась
});

// Создаем серию свечей
const candleSeries = chart.addCandlestickSeries({
    upColor: '#089981', downColor: '#f23645', borderVisible: false,
    wickUpColor: '#089981', wickDownColor: '#f23645',
});

// Данные для пар (базовые)
const PAIRS = ["EURUSD", "GBPUSD", "USDJPY", "USDCHF", "AUDUSD", "USDCAD", "NZDUSD", "EURGBP", "EURJPY", "EURCHF"];
const BASE_PRICES = {
    "EURUSD": 1.08642, "GBPUSD": 1.27846, "USDJPY": 151.99234, "USDCHF": 0.88093,
    "AUDUSD": 0.65640, "USDCAD": 1.37039, "NZDUSD": 0.60120, "EURGBP": 0.85420, "EURJPY": 165.120, "EURCHF": 0.95710
};

let currentPair = "EURUSD";
let prices = Object.assign({}, BASE_PRICES);

// Генерация фейковых свечей для графика
function generateCandles(basePrice, count = 100) {
    let candles = [];
    let p = basePrice;
    let time = Math.floor(Date.now() / 1000) - (count * 60); // Начинаем с прошлого
    
    for (let i = 0; i < count; i++) {
        let open = p;
        let close = p + (Math.random() - 0.5) * p * 0.002;
        let high = Math.max(open, close) + Math.random() * p * 0.001;
        let low = Math.min(open, close) - Math.random() * p * 0.001;
        
        candles.push({ time: time + (i * 60), open, high, low, close });
        p = close;
    }
    return candles;
}

// Форматирование цены
function fmt(v) { return v.toFixed(v > 100 ? 3 : 5); }

// Обновление заголовка и уровней
function updateHeader(sym, price) {
    document.getElementById('header-symbol').textContent = sym.slice(0,3) + "/" + sym.slice(3);
    document.getElementById('header-entry').textContent = fmt(price);
    document.getElementById('header-sl').textContent = fmt(price * 0.995);
    document.getElementById('header-tp').textContent = fmt(price * 1.010);
    
    // Фейковое изменение в процентах
    const change = (Math.random() * 2 - 1).toFixed(2);
    const changeEl = document.getElementById('header-change');
    changeEl.textContent = (change > 0 ? "+" : "") + change + "%";
    changeEl.className = "pair-change " + (change > 0 ? "up" : "down");
}

// Отрисовка списка пар
function renderList() {
    const listEl = document.getElementById('pair-list');
    listEl.innerHTML = "";
    
    PAIRS.forEach(sym => {
        const price = prices[sym];
        const change = (Math.random() * 2 - 1).toFixed(2);
        const isActive = sym === currentPair ? "active" : "";
        
        const item = document.createElement('div');
        item.className = `list-item ${isActive}`;
        item.onclick = () => selectPair(sym);
        
        item.innerHTML = `
            <div class="list-item-left">
                <div class="list-symbol">${sym.slice(0,3)}/${sym.slice(3)}</div>
                <div class="list-signal">нет сигнала</div>
            </div>
            <div class="list-item-right">
                <div class="list-price">${fmt(price)}</div>
                <div class="list-price-change ${change > 0 ? 'up' : 'down'}">${change > 0 ? '+' : ''}${change}%</div>
            </div>
        `;
        listEl.appendChild(item);
    });
}

// Выбор пары (обновляет график и заголовок)
function selectPair(sym) {
    currentPair = sym;
    const price = prices[sym];
    
    updateHeader(sym, price);
    candleSeries.setData(generateCandles(price));
    renderList(); // Перерисовываем список, чтобы подсветить активную
    
    // Автоматически подгоняем масштаб графика
    chart.timeScale().fitContent();
}

// Симуляция изменения цен (каждую секунду)
setInterval(() => {
    PAIRS.forEach(sym => {
        prices[sym] += (Math.random() - 0.5) * prices[sym] * 0.0002;
    });
    
    // Обновляем заголовок и список
    updateHeader(currentPair, prices[currentPair]);
    renderList();
    
    // Обновляем последнюю свечу на графике
    const price = prices[currentPair];
    const lastCandle = generateCandles(price, 1)[0];
    candleSeries.update({
        time: Math.floor(Date.now() / 1000),
        open: price,
        high: price + 0.0005,
        low: price - 0.0005,
        close: price
    });
    
}, 1000);

// Запуск при загрузке
selectPair("EURUSD");
</script>
</body>
</html>
