<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FX Trading Bot</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #131722; color: #d1d4dc; padding-bottom: 60px; }
    .screen { display: none; }
    .screen.active { display: block; }
    
    /* --- Экран Рынок --- */
    #chart-container { width: 100%; height: 300px; background: #131722; }
    .pair-header { padding: 16px; border-bottom: 1px solid #2a2e39; }
    .pair-title-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .pair-title { font-size: 22px; font-weight: 700; color: #fff; }
    .pair-change { font-size: 14px; font-weight: 600; color: #089981; }
    .levels-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .level-box { flex: 1; background: #1e222d; border-radius: 6px; padding: 8px; }
    .level-label { font-size: 11px; color: #787b86; margin-bottom: 4px; }
    .level-value { font-size: 14px; font-weight: 600; }
    .level-value.sl { color: #f23645; }
    .level-value.tp { color: #089981; }
    
    /* Активная стратегия */
    .active-strategy-box { background: #1e222d; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #2962ff; }
    .as-label { font-size: 12px; color: #787b86; text-transform: uppercase; }
    .as-name { font-size: 16px; font-weight: 700; color: #2962ff; }

    /* --- Экран Стратегии --- */
    .strategy-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #2a2e39; }
    .strategy-name { font-size: 15px; font-weight: 600; color: #fff; }
    .btn-apply { background: #2a2e39; border: 1px solid #363a45; color: #d1d4dc; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-apply.active { background: #2962ff; border-color: #2962ff; color: #fff; }

    /* --- Экран Тест --- */
    .test-header { padding: 16px; text-align: center; }
    .btn-primary { width: 100%; background: #2962ff; border: none; border-radius: 6px; padding: 12px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; }
    .btn-primary:disabled { opacity: 0.6; }
    .result-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #2a2e39; }
    .result-row.top1 { background: #1e222d; }
    .res-left { display: flex; flex-direction: column; }
    .res-title { font-size: 14px; font-weight: 700; color: #fff; }
    .res-stats { font-size: 11px; color: #787b86; margin-top: 2px; }
    .res-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;}
    .res-pnl { font-size: 15px; font-weight: 700; }

    /* Нижнее меню */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #1e222d; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #2a2e39; z-index: 100; }
    .nav-item { color: #787b86; font-size: 11px; text-align: center; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
    .nav-item.active { color: #2962ff; }
    .nav-icon { font-size: 20px; }
</style>
</head>
<body>

<!-- ЭКРАН: РЫНОК -->
<div id="screen-market" class="screen active">
    <div id="chart-container"></div>
    <div class="pair-header">
        <div class="pair-title-row">
            <div class="pair-title" id="header-symbol">EUR/USD</div>
            <div class="pair-change" id="header-change">+0.31%</div>
        </div>
        <div class="levels-row">
            <div class="level-box"><div class="level-label">Вход</div><div class="level-value" id="header-entry">1.08642</div></div>
            <div class="level-box"><div class="level-label">Стоп-лосс</div><div class="level-value sl" id="header-sl">1.08460</div></div>
            <div class="level-box"><div class="level-label">Тейк-профит</div><div class="level-value tp" id="header-tp">1.09007</div></div>
        </div>
        <div class="active-strategy-box">
            <div>
                <div class="as-label">Текущая стратегия</div>
                <div class="as-name" id="active-strat-text">SMA 10/30</div>
            </div>
            <div style="font-size:24px;">⚙️</div>
        </div>
    </div>
</div>

<!-- ЭКРАН: СТРАТЕГИИ -->
<div id="screen-strategies" class="screen">
    <div style="padding: 16px; border-bottom: 1px solid #2a2e39;">
        <h2 style="color:#fff; font-size:20px;">Выбор стратегии</h2>
        <p style="color:#787b86; font-size:12px; margin-top:4px;">Выберите одну из 20 стратегий для активной торговли.</p>
    </div>
    <div id="strategies-container"></div>
</div>

<!-- ЭКРАН: ТЕСТ -->
<div id="screen-test" class="screen">
    <div class="test-header">
        <h2 style="color:#fff; font-size:20px;">Сравнение стратегий</h2>
        <p style="color:#787b86; font-size:12px; margin-top:8px;">Проверьте все 20 стратегий на истории и выберите лучшую.</p>
        <button class="btn-primary" onclick="runCompare()" id="btn-run-compare">▶ Запустить тест</button>
        <div id="loading" style="display:none; color:#eab308; margin-top:12px; font-size:13px;">⏳ Считаем историю...</div>
    </div>
    <div id="compare-results"></div>
</div>

<!-- НИЖНЕЕ МЕНЮ -->
<div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('market', this)"><div class="nav-icon">📈</div>Рынок</div>
    <div class="nav-item" onclick="switchTab('strategies', this)"><div class="nav-icon">⚙️</div>Стратегии</div>
    <div class="nav-item" onclick="switchTab('test', this)"><div class="nav-icon">🧪</div>Тест</div>
</div>

<script>
const PAIRS = ["EURUSD","GBPUSD","USDJPY","USDCHF","AUDUSD","USDCAD","NZDUSD","EURGBP","EURJPY","EURCHF","GBPJPY","GBPCHF","AUDJPY","AUDCAD","AUDNZD","CADJPY","CHFJPY","NZDJPY","EURAUD","EURCAD"];
const BASE_PRICES = {"EURUSD":1.08642,"GBPUSD":1.27846,"USDJPY":151.99234,"USDCHF":0.88093,"AUDUSD":0.65640,"USDCAD":1.37039,"NZDUSD":0.60120,"EURGBP":0.85420,"EURJPY":165.120,"EURCHF":0.95710,"GBPJPY":195.492,"GBPCHF":1.12412,"AUDJPY":102.101,"AUDCAD":0.89527,"AUDNZD":1.07459,"CADJPY":113.376,"CHFJPY":173.131,"NZDJPY":93.120,"EURAUD":1.64500,"EURCAD":1.47500};
const STRATEGY_LIST = ["SMA 10/30", "SMA 20/50", "EMA 9/21", "EMA 12/26", "RSI 30/70", "RSI 50 cross", "BB Reversal", "BB Breakout", "MACD Cross", "MACD Zero", "Stoch 20/80", "Stoch 50", "Triple EMA", "Donchian 20", "Donchian 50", "Momentum 10", "SMA Slope", "EMA Slope", "Price vs SMA50", "Price vs EMA20"];

let currentPair = "EURUSD";
let prices = Object.assign({}, BASE_PRICES);
let activeStrategy = localStorage.getItem("activeStrategy") || "SMA 10/30";
let chart, candleSeries;

function fmt(v) { return v.toFixed(v > 100 ? 3 : 5); }
function switchTab(tabName, el) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + tabName).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if(el) el.classList.add('active');
    window.scrollTo(0, 0);
}

// --- Логика Графика ---
function initChart() {
    const container = document.getElementById('chart-container');
    if (!container || typeof LightweightCharts === 'undefined') return;
    chart = LightweightCharts.createChart(container, {
        layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2a2e39' },
        timeScale: { borderColor: '#2a2e39', timeVisible: true },
        handleScroll: false, handleScale: false,
    });
    candleSeries = chart.addCandlestickSeries({ upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645' });
}

function generateCandles(basePrice, count = 100) {
    let candles = [], p = basePrice, time = Math.floor(Date.now() / 1000) - (count * 60);
    for (let i = 0; i < count; i++) {
        let open = p, close = p + (Math.random() - 0.5) * p * 0.002;
        let high = Math.max(open, close) + Math.random() * p * 0.001;
        let low = Math.min(open, close) - Math.random() * p * 0.001;
        candles.push({ time: time + (i * 60), open, high, low, close });
        p = close;
    }
    return candles;
}

function updateHeader(sym, price) {
    document.getElementById('header-symbol').textContent = sym.slice(0,3) + "/" + sym.slice(3);
    document.getElementById('header-entry').textContent = fmt(price);
    document.getElementById('header-sl').textContent = fmt(price * 0.995);
    document.getElementById('header-tp').textContent = fmt(price * 1.010);
    const change = (Math.random() * 2 - 1).toFixed(2);
    const changeEl = document.getElementById('header-change');
    changeEl.textContent = (change > 0 ? "+" : "") + change + "%";
    changeEl.className = "pair-change " + (change > 0 ? "up" : "down");
}

// --- Вкладка Стратегии ---
function renderStrategies() {
    const container = document.getElementById('strategies-container');
    container.innerHTML = "";
    STRATEGY_LIST.forEach(name => {
        const div = document.createElement('div');
        div.className = "strategy-item";
        const isActive = name === activeStrategy;
        div.innerHTML = `
            <div class="strategy-name">${name}</div>
            <button class="btn-apply ${isActive ? 'active' : ''}" onclick="applyStrategy('${name}')">
                ${isActive ? 'Активна' : 'Применить'}
            </button>
        `;
        container.appendChild(div);
    });
    document.getElementById('active-strat-text').textContent = activeStrategy;
}

function applyStrategy(name) {
    activeStrategy = name;
    localStorage.setItem("activeStrategy", name);
    renderStrategies();
    switchTab('market', document.querySelector('.nav-item')); // Перекидываем на рынок
}

// --- Вкладка Тест ---
async function runCompare() {
    const btn = document.getElementById("btn-run-compare");
    const loading = document.getElementById("loading");
    const results = document.getElementById("compare-results");
    
    btn.disabled = true; loading.style.display = "block"; results.innerHTML = "";
    
    try {
        const res = await fetch('/api/strategies/compare');
        const data = await res.json();
        
        if (data.error) {
            alert("Ошибка сервера: " + data.error);
            return;
        }
        if (!Array.isArray(data)) {
            alert("Сервер вернул неверный формат данных. Убедитесь, что main.py обновлен.");
            return;
        }

        let html = "";
        data.forEach((s, idx) => {
            const pnlColor = s.pnl >= 0 ? "#089981" : "#f23645";
            const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : "";
            const isAct = s.name === activeStrategy;
            
            html += `
                <div class="result-row ${idx === 0 ? 'top1' : ''}">
                    <div class="res-left">
                        <div class="res-title">${medal} ${s.name}</div>
                        <div class="res-stats">${s.trades} сделок · WR ${s.winrate}%</div>
                    </div>
                    <div class="res-right">
                        <div class="res-pnl" style="color:${pnlColor}">${s.pnl > 0 ? '+' : ''}${s.pnl}R</div>
                        <button class="btn-apply ${isAct ? 'active' : ''}" onclick="applyStrategy('${s.name}')">
                            ${isAct ? 'Активна' : 'Выбрать'}
                        </button>
                    </div>
                </div>`;
        });
        results.innerHTML = html;
    } catch (e) {
        alert("Ошибка при тестировании: " + e.message);
    } finally {
        btn.disabled = false; loading.style.display = "none";
    }
}

// Инициализация
window.onload = () => {
    initChart();
    updateHeader("EURUSD", prices["EURUSD"]);
    if (candleSeries) { candleSeries.setData(generateCandles(prices["EURUSD"])); chart.timeScale().fitContent(); }
    renderStrategies();
    
    setInterval(() => {
        PAIRS.forEach(sym => { prices[sym] += (Math.random() - 0.5) * prices[sym] * 0.0002; });
        updateHeader(currentPair, prices[currentPair]);
    }, 1000);
};
</script>
</body>
</html>
