name: Automatic virtual trade journal

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: automatic-virtual-journal
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Python syntax
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application files
        run: python -m py_compile main.py engine.py
      - name: Scan Capital.com Demo and update virtual journal
        if: github.event_name != 'push'
        env:
          AUTO_SCAN_KEY: ${{ secrets.AUTO_SCAN_KEY }}
          APP_URL: https://fx-trading-bot-2vzh.onrender.com
        run: |
          if [ -z "$AUTO_SCAN_KEY" ]; then
            echo "Waiting for AUTO_SCAN_KEY to be added in GitHub and Render."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 240 \
            -H "X-AUTO-SCAN-KEY: $AUTO_SCAN_KEY" \
            "$APP_URL/api/capital/scan"
